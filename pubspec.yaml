name: nerimobile
description: "Non-offical mobile client for Nerimity."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  go_router: ^17.2.1
  material_symbols_icons: ^4.2906.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  scrollable_positioned_list: ^0.3.8
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf

  assets:
    - assets/fonts/OFL.txt
