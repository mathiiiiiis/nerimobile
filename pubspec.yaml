name: nerimobile
description: "Non-offical mobile client for Nerimity."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  drift: ^2.35.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  go_router: ^17.2.1
  image_picker: ^1.2.3
  material_symbols_icons: ^4.2906.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  scrollable_positioned_list: ^0.3.8
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf

  assets:
    - assets/icon/
    - assets/fonts/OFL.txt
